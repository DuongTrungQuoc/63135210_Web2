<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm Hàng Hóa</title>
</head>
<body>
    <h1>Thêm Hàng Hóa Mới</h1>
    <form action="#" th:action="@{/saveHangHoa}" th:object="${hangHoa}" method="post">
        <label for="tenHang">Tên Hàng</label>
        <input type="text" id="tenHang" name="tenHang" th:field="*{tenHang}"/>
        <label for="maChatLieu">Chất Liệu</label>
        <select id="maChatLieu" name="maChatLieu" th:field="*{maChatLieu}">
            <option th:each="chatLieu : ${listChatLieu}" th:value="${chatLieu}" th:text="${chatLieu.tenChatLieu}">Chất Liệu</option>
        </select>
        <label for="soLuong">Số Lượng</label>
        <input type="number" id="soLuong" name="soLuong" th:field="*{soLuong}"/>
        <label for="donGiaNhap">Đơn Giá Nhập</label>
        <input type="text" id="donGiaNhap" name="donGiaNhap" th:field="*{donGiaNhap}"/>
        <label for="donGiaBan">Đơn Giá Bán</label>
        <input type="text" id="donGiaBan" name="donGiaBan" th:field="*{donGiaBan}"/>
        <label for="anh">Ảnh</label>
        <input type="text" id="anh" name="anh" th:field="*{anh}"/>
        <label for="ghiChu">Ghi Chú</label>
        <input type="text" id="ghiChu" name="ghiChu" th:field="*{ghiChu}"/>
        <button type="submit">Lưu</button>
    </form>
</body>
</html>
