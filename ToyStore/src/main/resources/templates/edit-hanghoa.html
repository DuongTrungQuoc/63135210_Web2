<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa Hàng Hóa</title>
</head>
<body>
    <h1>Sửa Hàng Hóa</h1>
    <form th:action="@{/hanghoa/update/{id}(id=${hangHoa.maHang})}" th:object="${hangHoa}" method="post">
        <label for="tenHang">Tên Hàng:</label>
        <input type="text" id="tenHang" th:field="*{tenHang}"/><br/>
        
        <label for="maChatLieu">Chất Liệu:</label>
        <select id="maChatLieu" th:field="*{maChatLieu}" th:object="${listChatLieu}">
            <option th:each="chatLieu : ${listChatLieu}" th:value="${chatLieu}" th:text="${chatLieu.tenChatLieu}"></option>
        </select><br/>
        
        <label for="soLuong">Số Lượng:</label>
        <input type="number" id="soLuong" th:field="*{soLuong}"/><br/>
        
        <label for="donGiaNhap">Đơn Giá Nhập:</label>
        <input type="number" id="donGiaNhap" th:field="*{donGiaNhap}"/><br/>
        
        <label for="donGiaBan">Đơn Giá Bán:</label>
        <input type="number" id="donGiaBan" th:field="*{donGiaBan}"/><br/>
        
        <label for="anh">Ảnh:</label>
        <input type="text" id="anh" th:field="*{anh}"/><br/>
        
        <label for="ghiChu">Ghi Chú:</label>
        <input type="text" id="ghiChu" th:field="*{ghiChu}"/><br/>
        
        <button type="submit">Cập Nhật</button>
    </form>
    <a th:href="@{/hanghoa}">Trở về</a>
</body>
</html>
