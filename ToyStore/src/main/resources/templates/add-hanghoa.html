<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm Hàng Hóa</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
</head>
<body>
    <h1>Thêm Hàng Hóa</h1>
    <form th:action="@{/hanghoa/save}" th:object="${hangHoa}" method="post" enctype="multipart/form-data">
        <div>
            <label>Tên Hàng:</label>
            <input type="text" th:field="*{tenHang}" />
        </div>
        <div>
            <label>Chất Liệu:</label>
            <br>
            <select th:field="*{maChatLieu}">
                <option th:each="chatLieu : ${listChatLieu}" th:value="${chatLieu}" th:text="${chatLieu.tenChatLieu}"></option>
            </select>
        </div>
        <div>
            <label>Số Lượng:</label>
            <input type="number" th:field="*{soLuong}" />
        </div>
        <div>
            <label>Đơn Giá Nhập:</label>
            <input type="number" th:field="*{donGiaNhap}" />
        </div>
        <div>
            <label>Đơn Giá Bán:</label>
            <input type="number" th:field="*{donGiaBan}" />
        </div>
        <div>
            <label>Ảnh:</label>
            <input type="file" name="file" />
        </div>
        <div>
            <label>Ghi Chú:</label>
            <textarea th:field="*{ghiChu}"></textarea>
        </div>
        <div>
            <button type="submit">Lưu</button>
        </div>
    </form>
</body>
</html>
